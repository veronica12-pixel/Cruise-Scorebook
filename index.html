<style>
/* Layout: one-screen phone app — trip strip, game switch, two side-by-side player columns of raised pastel buttons, bottom-pinned tab bar */
:root{
  --bg:#F6F1FB; --surface:#FFFFFF; --ink:#3B3551; --muted:#7A7390; --line:#E7E0F1;
  --accent:#C7A6EC; --accent-edge:#A485CB; --accent-soft:#F1E8FC; --accent-ink:#6A4B93;
  --peach:#FFD5B5; --peach-edge:#E6B18A;
  --p1:#F9C3D0; --p1-edge:#DD98AB; --p1-soft:#FDEDF1; --p1-ink:#A4465E;
  --p2:#A9E2EA; --p2-edge:#7CC1CC; --p2-soft:#E6F7F9; --p2-ink:#226F7B;
  --mint:#C3EAD6; --mint-edge:#93C9AE;
  --dom:#FFE9A8; --dom-edge:#E2C163; --dom-soft:#FFF8E1; --dom-ink:#7A5A0E;
  --sca:#DCC8F7; --sca-edge:#B095DA; --sca-soft:#F4EDFD; --sca-ink:#5E3F8C;
  --on-pastel:#2F2A42; --hi:rgba(255,255,255,.75); --drop:rgba(80,60,120,.16);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --nav-h:66px;
  padding-top:env(safe-area-inset-top,0px);
  color-scheme:light;
}

*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,summary,select,input,label,a,[data-add],[data-sadd]{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* the 3D button: pastel face, glossy top, solid darker edge underneath; pressing sinks it */
.b3d{--face:var(--accent);--edge:var(--accent-edge);
  position:relative;border:none;border-radius:14px;color:var(--on-pastel);font-weight:700;
  background:linear-gradient(180deg,var(--hi) 0%,rgba(255,255,255,0) 55%),var(--face);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.06),0 5px 0 var(--edge),0 9px 14px var(--drop);
  transform:translateY(0);transition:transform .07s ease,box-shadow .07s ease}
.b3d:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.06),0 1px 0 var(--edge),0 2px 4px var(--drop)}
.b3d:disabled{opacity:.45;cursor:default}
/* keep the full tap area under the finger while the button sinks */
.b3d::before{content:"";position:absolute;left:0;right:0;top:-6px;bottom:-6px;border-radius:inherit}
.b3d:active:not(:disabled)::before{top:-10px;bottom:-2px}

/* trip strip */
.trip{display:flex;flex-direction:column;gap:6px;padding-block:6px 14px;border-bottom:2px dotted var(--line);margin-bottom:14px}
.trip{position:relative;padding-right:96px}
.badges{position:absolute;right:4px;top:2px;display:flex;align-items:flex-start}
.dtile{width:30px;height:auto;margin:10px -6px 0 0;transform:rotate(-14deg);position:relative;z-index:1;filter:drop-shadow(0 4px 0 var(--accent-edge)) drop-shadow(0 6px 10px var(--drop));transition:transform .25s}
.dtile:hover{transform:rotate(-2deg) scale(1.06)}
.qcard{width:54px;height:auto;transform:rotate(8deg);filter:drop-shadow(0 4px 0 var(--accent-edge)) drop-shadow(0 6px 10px var(--drop));transition:transform .25s}
.qcard:hover{transform:rotate(-4deg) scale(1.06)}
.trip h1{font-size:22px;font-weight:800;line-height:1.15;min-width:0}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.route b{color:var(--ink);font-weight:700}
.dayrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
input,select,textarea{font:inherit;font-size:max(16px,1em);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-height:44px;max-width:100%}

/* game switch */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.seg button{min-height:50px;font-family:var(--display);font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;--face:var(--surface);--edge:var(--line);color:var(--muted)}
.seg button[aria-pressed="true"]{--face:var(--accent);--edge:var(--accent-edge);color:var(--on-pastel)}
.seg svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.seg svg.qmini{width:18px;height:26px;stroke:none;fill:initial;transform:rotate(-6deg)}
.seg svg.dmini{width:14px;height:28px;transform:rotate(-10deg)}
.rulehint{font-size:13px;color:var(--muted);margin:-4px 0 12px}

/* players */
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.player{min-width:0;display:flex;flex-direction:column;gap:10px;padding:12px 12px 16px;border-radius:20px;background:var(--ps);border:2px solid var(--pc)}
.p1{--pc:var(--p1);--pe:var(--p1-edge);--ps:var(--p1-soft);--pd:var(--p1-ink)}
.p2{--pc:var(--p2);--pe:var(--p2-edge);--ps:var(--p2-soft);--pd:var(--p2-ink)}
.pname{font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--pd)}
.score{font-family:var(--display);font-weight:800;font-size:clamp(46px,15vw,68px);line-height:.95;color:var(--pd);font-variant-numeric:tabular-nums}
.togo{font-size:12px;color:var(--muted);min-height:1.4em}
.meter{height:8px;border-radius:999px;background:var(--surface);overflow:hidden;box-shadow:inset 0 1px 2px var(--drop)}
.meter span{display:block;height:100%;border-radius:999px;background:var(--pe)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px;padding-bottom:4px}
.tilebtn{min-height:54px;font-family:var(--display);font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;--face:var(--pc);--edge:var(--pe)}
.tilebtn .plus{font-size:15px;opacity:.65;margin-right:1px}
.onebtn{min-height:46px;font-size:18px;--face:var(--surface);--edge:var(--line);color:var(--pd)}
.onebtn.plus1{--face:var(--mint);--edge:var(--mint-edge);color:var(--on-pastel)}
.ones{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;padding-bottom:4px}
.typein{display:grid;grid-template-columns:1fr auto;gap:6px;padding-bottom:4px}
.typein input{width:100%;min-width:0;font-size:18px;font-weight:700;text-align:center;border-color:var(--pc)}
.typein .onebtn{padding:0 12px}
.pwins{font-size:13px;color:var(--muted);border-top:2px dotted var(--pc);padding-top:8px}
.pwins b{color:var(--pd);font-family:var(--display);font-size:16px}
.flash{animation:flash .35s ease}
@keyframes flash{0%{transform:scale(1.1)}100%{transform:scale(1)}}

.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;padding-bottom:5px}
.btn{min-height:50px;padding:0 18px;--face:var(--surface);--edge:var(--line);color:var(--ink)}
.btn.primary{--face:var(--accent);--edge:var(--accent-edge);color:var(--on-pastel);flex:1}
.btn.danger{--face:var(--p1);--edge:var(--p1-edge);color:var(--on-pastel)}
.target{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--muted)}
.target select{min-height:40px;padding:4px 8px}

.banner{margin-top:14px;padding:14px;border-radius:18px;background:var(--peach);color:var(--on-pastel);display:flex;flex-direction:column;gap:12px;box-shadow:0 5px 0 var(--peach-edge)}
.banner h3{font-size:18px}
.banner .row{display:flex;gap:10px;padding-bottom:5px}

.log{margin-top:14px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums;font-weight:700}
.chip.c1{background:var(--p1-soft);color:var(--p1-ink)} .chip.c2{background:var(--p2-soft);color:var(--p2-ink)}

/* tally + games */
.tally{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:16px;border-radius:20px;background:var(--surface);border:2px solid var(--line);margin-bottom:10px}
.tally .side{min-width:0;text-align:center;padding:10px 6px;border-radius:14px}
.tally .side:first-child{color:var(--p1-ink);background:var(--p1-soft)} .tally .side:last-child{color:var(--p2-ink);background:var(--p2-soft)}
.tally .big{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.tally .who{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tally .dash{font-family:var(--display);font-size:28px;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.g-domino{--gc:var(--dom);--ge:var(--dom-edge);--gs:var(--dom-soft);--gi:var(--dom-ink)}
.g-scala{--gc:var(--sca);--ge:var(--sca-edge);--gs:var(--sca-soft);--gi:var(--sca-ink)}
.gbox{min-width:0;padding:12px;border-radius:18px;background:var(--gs);border:2px solid var(--gc);box-shadow:0 4px 0 var(--ge);display:flex;flex-direction:column;gap:4px}
.gbox-h{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;color:var(--gi)}
.gbox-h .gico{width:22px;height:32px;flex:none;transform:rotate(-8deg)}
.g-domino .gbox-h .gico{width:16px}
.gbox-score{display:flex;align-items:baseline;justify-content:space-between;font-family:var(--display);font-weight:800;font-size:36px;line-height:1.05;font-variant-numeric:tabular-nums;padding-inline:4px}
.gbox-score .w1{color:var(--p1-ink)} .gbox-score .w2{color:var(--p2-ink)} .gbox-score .dash{font-size:22px;color:var(--muted)}
.gbox-names{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:700}
.gbox-names span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbox-names span:first-child{color:var(--p1-ink)} .gbox-names span:last-child{color:var(--p2-ink);text-align:right}
.gbox-foot{font-size:12px;color:var(--muted);border-top:2px dotted var(--gc);padding-top:6px;margin-top:2px}
.sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:4px}
.filters button{padding:6px 14px;font-size:13px;border-radius:999px;--face:var(--surface);--edge:var(--line);color:var(--muted)}
.filters button{display:inline-flex;align-items:center;gap:6px}
.filters .fico{width:11px;height:18px;transform:rotate(-8deg)}
.filters button[aria-pressed="true"]{--face:var(--accent);--edge:var(--accent-edge);color:var(--on-pastel)}
.filters .f-domino[aria-pressed="true"]{--face:var(--dom);--edge:var(--dom-edge)}
.filters .f-scala[aria-pressed="true"]{--face:var(--sca);--edge:var(--sca-edge)}
.section-h{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;gap:10px;flex-wrap:wrap}
.section-h h2{font-size:18px}
.day{margin-bottom:12px}
.day .eyebrow{margin-bottom:6px}
.game{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;background:var(--gs);border:2px solid var(--gc);border-radius:14px;margin-bottom:8px}
.gbadge{display:flex;flex-direction:column;align-items:center;gap:2px;width:34px}
.gbadge .rico{width:20px;height:30px;transform:rotate(-8deg)}
.g-domino .gbadge .rico{width:15px}
.gname{display:block;font-size:12px;font-weight:700;color:var(--gi);margin-bottom:1px}
.gend{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.game .res .pair{white-space:nowrap;margin-right:8px}
.game .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.game .res{min-width:0;font-variant-numeric:tabular-nums;font-size:15px}
.game .res b{font-family:var(--display)}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;color:var(--on-pastel)}
.pill.w1{background:var(--p1)} .pill.w2{background:var(--p2)} .pill.tie{background:var(--peach)}
.xbtn{border:none;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:16px}

/* trips */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:700;min-width:0}
.form input{width:100%}
.presets{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px}
.preset{padding:9px 12px;font-size:13px;text-align:left;font-weight:400;--face:var(--peach);--edge:var(--peach-edge)}
.preset b{font-weight:700}
.tripcard{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;margin-bottom:12px;width:100%;text-align:left;font-weight:400;--face:var(--surface);--edge:var(--line);color:var(--ink)}
.tripcard.active{--face:var(--accent-soft);--edge:var(--accent)}
.tripcard .t{min-width:0}
.tripcard .t b{display:block;font-family:var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tripcard .t span{font-size:13px;color:var(--muted)}
.tripcard .w{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent-ink)}

footer{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 16px var(--drop)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;height:var(--nav-h);padding:6px 8px 10px}
nav.tabs button{border:none;border-radius:14px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--on-pastel);background:linear-gradient(180deg,var(--hi),rgba(255,255,255,0) 55%),var(--accent);box-shadow:0 4px 0 var(--accent-edge)}

/* confirm sheet */
.scrim{position:fixed;inset:0;background:rgba(40,30,60,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet p{margin:0;color:var(--muted)}
.sheet .row{display:flex;gap:10px;padding-bottom:5px}
.sheet .row .btn{flex:1}


/* winner celebration */
.party{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,30,60,.45)}
.party canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.trophy-card{position:relative;width:100%;max-width:360px;border-radius:28px;padding:26px 20px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;
  background:linear-gradient(180deg,var(--hi),rgba(255,255,255,0) 45%),var(--pc);color:var(--on-pastel);
  box-shadow:0 8px 0 var(--pe),0 18px 40px var(--drop);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.trophy-card.tie{--pc:var(--peach);--pe:var(--peach-edge)}
.trophy-card svg{width:84px;height:84px;filter:drop-shadow(0 4px 0 var(--pe))}
.trophy-card .eyebrow{color:var(--on-pastel);opacity:.7}
.trophy-card h2{font-size:34px;font-weight:800;line-height:1.05}
.trophy-card .final{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.trophy-card .final small{display:block;font-family:var(--body);font-weight:700;font-size:13px;opacity:.75}
.trophy-card .series{margin-top:4px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.55);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.trophy-card .btn{margin-top:10px;width:100%;--face:var(--surface);--edge:var(--pe);color:var(--ink)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.trophy-card{animation:none}}


/* copyright trigger + Save As popup */
.copyright{border:none;background:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:6px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.copyright:hover{color:var(--ink);background:var(--accent-soft)}
.syncdot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.syncdot.ok{background:var(--mint-edge)} .syncdot.wait{background:var(--peach-edge)} .syncdot.off{background:var(--line)}
.save-scrim{align-items:center;padding:16px}
.save-sheet{max-width:380px;max-height:88vh;overflow:auto;border-radius:22px;padding-bottom:20px}
.save-h{display:flex;justify-content:space-between;align-items:center}
.save-h h3{font-size:22px}
.xclose{border:none;background:var(--accent-soft);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1}
.save-sec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:2px dotted var(--line)}
.save-sec .eyebrow{margin:0}
.save-help{margin:0;font-size:14px;color:var(--muted)}
.save-row{display:flex;gap:10px;flex-wrap:wrap;padding-bottom:5px}
.save-row .btn{flex:1;min-width:130px}
.sync-line{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--bg)}
.sync-line i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--line)}
.sync-line.ok i{background:var(--mint-edge)} .sync-line.wait i{background:var(--peach-edge)}
.sync-line span{min-width:0} .sync-line small{display:block;color:var(--muted);font-size:12px}
.save-status{min-height:1.2em;font-size:13px;color:var(--accent-ink);margin:0}


/* per-player points drop-downs */
.pts-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;align-items:start}
.pts-head{display:none}
.pts{min-width:0;border-radius:16px;background:var(--ps);border:2px solid var(--pc);box-shadow:0 4px 0 var(--pe);overflow:hidden}
.pts summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:0 6px;align-items:center;padding:10px 12px;min-height:52px}
.pts summary::-webkit-details-marker{display:none}
.pts-name{font-family:var(--display);font-weight:700;color:var(--pd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.pts-count{grid-column:1;font-size:12px;color:var(--muted)}
.chev{grid-column:2;grid-row:1 / span 2;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--pc);color:var(--on-pastel);font-size:14px;transition:transform .2s}
.pts[open] .chev{transform:rotate(180deg)}
.pts summary:focus-visible{outline:3px solid var(--accent-ink);outline-offset:-3px;border-radius:14px}
.pts-list{list-style:none;margin:0;padding:4px 10px 10px;max-height:260px;overflow:auto;border-top:2px dotted var(--pc)}
.pts-list li{display:grid;grid-template-columns:1.6em 1fr auto;align-items:baseline;gap:6px;padding:6px 2px;border-bottom:1px solid var(--surface);font-variant-numeric:tabular-nums}
.pts-list li:last-child{border-bottom:none}
.pts-list li.pts-hd{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding-top:8px}
.pts-list li:nth-child(2) .pts-t{color:var(--pd)}
.pts-i{font-size:11px;color:var(--muted)}
.pts-v{font-weight:700;color:var(--pd)} .pts-v.neg{color:var(--muted)}
.pts-t{font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink)}
.pts-empty{margin:0;padding:8px 12px 12px;font-size:13px;color:var(--muted);border-top:2px dotted var(--pc)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}


/* ports */
.tone-hi{--tc:var(--mint);--te:var(--mint-edge)} .tone-mid{--tc:var(--dom);--te:var(--dom-edge)} .tone-lo{--tc:var(--p1);--te:var(--p1-edge)} .tone-none{--tc:var(--line);--te:var(--line)}
.cruise-card{padding:16px;border-radius:22px;background:linear-gradient(180deg,var(--hi),rgba(255,255,255,0) 50%),var(--sca);color:var(--on-pastel);box-shadow:0 6px 0 var(--sca-edge);display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.cruise-card .eyebrow{color:var(--on-pastel);opacity:.7}
.cruise-big{font-family:var(--display);font-weight:800;font-size:58px;line-height:1}
.cruise-big small{font-size:20px;opacity:.6;margin-left:2px}
.cruise-sub{font-size:14px}
.cruise-players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cruise-players div{min-width:0;display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:8px 12px;border-radius:12px;background:var(--pc)}
.cruise-players span{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cruise-players b{font-family:var(--display);font-size:20px}
.port{padding:12px;border-radius:16px;background:var(--surface);border:2px solid var(--line);margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.port-top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.port-n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.port-t{min-width:0} .port-t b{display:block;font-family:var(--display);font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .port-t span{font-size:13px;color:var(--muted)}
.port-avg{min-width:58px;padding:6px 8px;border-radius:12px;text-align:center;background:var(--tc);box-shadow:0 3px 0 var(--te);color:var(--on-pastel)}
.port-avg b{display:block;font-family:var(--display);font-size:22px;line-height:1} .port-avg span{font-size:11px;opacity:.7}
.port-rates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rate{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 10px;border-radius:12px;background:var(--ps);border:2px solid var(--pc)}
.rate span{font-weight:700;font-size:13px;color:var(--pd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rate select{min-height:40px;padding:4px 8px;font-weight:800;font-size:17px;border-color:var(--pc);flex:none}
.port .xbtn{align-self:flex-end}
.port-kind{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink);background:var(--accent-soft);padding:1px 7px;border-radius:999px;margin-bottom:2px}
.port-note{align-self:flex-end;font-size:12px;color:var(--muted)}
.addport{margin-top:16px;padding:14px;border-radius:18px;background:var(--accent-soft);display:flex;flex-direction:column;gap:6px}
.addport h3{font-size:17px}
nav.tabs button{font-size:11.5px}


/* saved trip records */
.triprec{margin-bottom:14px}
.triprec .tripcard{margin-bottom:0}
.tr-right{display:flex;align-items:center;gap:8px;flex:none}
.tr-score{min-width:38px;text-align:center;padding:3px 8px;border-radius:10px;background:var(--tc);color:var(--on-pastel);font-family:var(--display);font-weight:800;font-size:15px}
.tripsum{margin:10px 6px 0;border-radius:14px;background:var(--surface);border:2px solid var(--line);overflow:hidden}
.tripsum summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.tripsum summary::-webkit-details-marker{display:none}
.tripsum .chev{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;transition:transform .2s}
.tripsum[open] .chev{transform:rotate(180deg)}
.ts-body{padding:4px 12px 12px;display:flex;flex-direction:column;gap:10px;border-top:2px dotted var(--line)}
.ts-route{font-size:13px;color:var(--muted);padding-top:8px}
.ts-games{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ts-games div{min-width:0;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;background:var(--gs);border:2px solid var(--gc)}
.ts-games span{font-size:13px;font-weight:700;color:var(--gi);flex:1;min-width:0}
.ts-games b{font-family:var(--display);font-size:17px}
.ts-games i{font-style:normal} .c1{color:var(--p1-ink)} .c2{color:var(--p2-ink)}
.tsico{width:12px;height:20px;flex:none;transform:rotate(-8deg)}
.ts-h{display:flex;justify-content:space-between;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.ts-h b{color:var(--ink);font-family:var(--display);font-size:15px}
.ts-ports{width:100%;border-collapse:collapse;font-size:14px}
.ts-ports th{font-size:11px;text-align:right;color:var(--muted);font-weight:700;padding:4px 4px 6px;white-space:nowrap;max-width:5.5em;overflow:hidden;text-overflow:ellipsis}
.ts-ports th:first-child,.ts-ports td:first-child{text-align:left}
.ts-ports td{padding:6px 4px;border-top:1px solid var(--line);text-align:right;vertical-align:middle}
.ts-ports td small{display:block;font-size:11px;color:var(--muted)}
.ts-ports tfoot td{font-weight:700;border-top:2px solid var(--line)}
.ts-avg{display:inline-block;min-width:34px;text-align:center;padding:2px 6px;border-radius:8px;background:var(--tc);color:var(--on-pastel);font-weight:800}
.ts-empty{margin:0;font-size:13px;color:var(--muted)}

@media (max-width:360px){.tilebtn{font-size:19px;min-height:50px}.player{padding:10px 10px 14px}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.b3d{transition:none}}

<body>

<div class="wrap">
  <header class="trip" id="tripHead"></header>
  <main id="view"></main>
  <footer><button type="button" class="copyright" id="copyright-trigger" aria-haspopup="dialog">© 2026 Thor<span class="syncdot" id="syncdot" aria-hidden="true"></span></button></footer>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="score" aria-current="page"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><line x1="6" y1="12" x2="18" y2="12"/><circle cx="12" cy="7.2" r=".9"/><circle cx="9.5" cy="15.5" r=".9"/><circle cx="14.5" cy="18" r=".9"/></svg>Score</button>
  <button data-tab="games"><svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8 21h8M9.5 17h5"/></svg>Wins</button>
  <button data-tab="ports"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M12 7.2V21M8 10.5h8"/><path d="M4.5 13.5c0 4.2 3.4 7.5 7.5 7.5s7.5-3.3 7.5-7.5"/><path d="M3 15l1.5-1.5L6 15M18 15l1.5-1.5L21 15"/></svg>Ports</button>
  <button data-tab="trips"><svg viewBox="0 0 24 24"><path d="M3 15h18l-2.5 4.5h-13z"/><path d="M6 15V9h10l2 6"/><path d="M9 9V6h4v3"/></svg>Trips</button>
</div></nav>

<div id="sheetRoot"></div>
<div id="partyRoot"></div>
<div id="saveRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
(function(){
const LS_KEY = "domino-scorebook-v1";
const QCARD = `<svg viewBox="0 0 100 140">
  <rect x="3" y="3" width="94" height="134" rx="10" fill="#FFFDF8" stroke="#3B3551" stroke-width="3"/>
  <rect x="11" y="11" width="78" height="118" rx="6" fill="#FDEDF1"/>
  <g fill="#D6455D" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
    <text x="16" y="34" font-size="24" text-anchor="middle">Q</text>
    <path d="M16 39c-2.6-3-7-1.2-7 2.2 0 3.3 4.4 5.6 7 8.6 2.6-3 7-5.3 7-8.6 0-3.4-4.4-5.2-7-2.2z"/>
    <g transform="rotate(180 50 70)">
      <text x="16" y="34" font-size="24" text-anchor="middle">Q</text>
      <path d="M16 39c-2.6-3-7-1.2-7 2.2 0 3.3 4.4 5.6 7 8.6 2.6-3 7-5.3 7-8.6 0-3.4-4.4-5.2-7-2.2z"/>
    </g>
  </g>
  <path d="M34 50l6 9 10-13 10 13 6-9 3 17H31z" fill="#FFD36E" stroke="#3B3551" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="34" cy="49" r="2.6" fill="#FFD36E" stroke="#3B3551" stroke-width="1.8"/>
  <circle cx="50" cy="45" r="2.6" fill="#FFD36E" stroke="#3B3551" stroke-width="1.8"/>
  <circle cx="66" cy="49" r="2.6" fill="#FFD36E" stroke="#3B3551" stroke-width="1.8"/>
  <path d="M50 78c-6-7-18-3.5-18 5 0 8.5 11 14 18 22 7-8 18-13.5 18-22 0-8.5-12-12-18-5z" fill="#D6455D" stroke="#3B3551" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M39 84c1-3 4-4.5 7-4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
</svg>`;
const DOMINO = `<svg viewBox="0 0 60 120"><rect x="3" y="3" width="54" height="114" rx="9" fill="#FFFDF8" stroke="#3B3551" stroke-width="3"/><line x1="10" y1="60" x2="50" y2="60" stroke="#3B3551" stroke-width="2.5" stroke-linecap="round"/><circle cx="30" cy="60" r="3.2" fill="#FFD36E" stroke="#3B3551" stroke-width="1.6"/><g fill="#D6455D"><circle cx="17" cy="17" r="5"/><circle cx="43" cy="17" r="5"/><circle cx="30" cy="31" r="5"/><circle cx="17" cy="45" r="5"/><circle cx="43" cy="45" r="5"/></g><g fill="#2A9AA8"><circle cx="17" cy="77" r="5"/><circle cx="30" cy="89" r="5"/><circle cx="43" cy="101" r="5"/></g></svg>`;
const GAMES = {domino:"Domino", scala:"Scala 40"};
const ICON = {
  domino:DOMINO.replace('<svg ','<svg class="qmini dmini" aria-hidden="true" '),
  scala:QCARD.replace('<svg ','<svg class="qmini" aria-hidden="true" ')
};
const PRESETS = [
  {name:"South Pacific crossing", ship:"Crown Princess", from:"Auckland, New Zealand", to:"Los Angeles, California", start:"2026-11-09", end:"2026-12-03"},
  {name:"Perth cruise", ship:"", from:"Perth, Australia", to:"", start:"", end:""},
  {name:"Mediterranean", ship:"Enchanted Princess", from:"Civitavecchia (Rome), Italy", to:"", start:"2027-11-20", end:""}
];
/* published itineraries: stops between departure and arrival, loaded once per trip */
const ITINERARIES = [{
  match: t => t.start === "2026-11-09" && /auckland/i.test(t.from||""),
  key: "crown-princess-2026-11-09", ship: "Crown Princess",
  stops: [["Tauranga, New Zealand","2026-11-10"],["Suva, Fiji","2026-11-13"],["Dravuni Island, Fiji","2026-11-14"],
          ["Papeete, Tahiti","2026-11-18"],["Moorea, French Polynesia","2026-11-19"],["Honolulu, Oahu, Hawaii","2026-11-25"],
          ["Kahului, Maui, Hawaii","2026-11-26"],["Hilo, Hawaii","2026-11-27"]]
}];
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = (iso, opts) => { if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number); if(!y||!m||!d) return iso; return new Date(y,m-1,d).toLocaleDateString(undefined, opts || {weekday:"short", month:"short", day:"numeric"}); };
const fmtRange = (a,b) => { if(!a && !b) return "Dates not set"; if(a && !b) return "From " + fmtDate(a,{month:"short",day:"numeric",year:"numeric"}); if(!a) return "Until " + fmtDate(b,{month:"short",day:"numeric",year:"numeric"}); return fmtDate(a,{month:"short",day:"numeric"}) + " – " + fmtDate(b,{month:"short",day:"numeric",year:"numeric"}); };

const blankScala = () => ({s1:0, s2:0, log:[]});
function newTrip(p){
  p = p || {};
  const t = {id:uid(), name:p.name||"New cruise", ship:p.ship||"", from:p.from||"", to:p.to||"", start:p.start||"", end:p.end||"",
          p1:"AT", p2:"Player 2", target:150, limit:101, games:[], days:{}, lastType:"domino", curDate:today(),
          cur:{s1:0, s2:0, log:[]}, scala:blankScala(), ports:[]};
  ensureEndPorts(t);
  loadItinerary(t);
  return t;
}
function migrate(s){
  s.trips.forEach(t => {
    t.days = t.days || {}; t.lastType = t.lastType || "domino"; t.limit = t.limit || 101;
    t.curDate = t.curDate || (t.cur && t.cur.date) || today();
    t.cur = t.cur || {s1:0,s2:0,log:[]};
    t.scala = t.scala || blankScala(); if(!Array.isArray(t.scala.log)) t.scala.log = [];
    t.games.forEach(g => { g.type = g.type || "domino"; });
    t.ports = Array.isArray(t.ports) ? t.ports : [];
    ensureEndPorts(t);
    if(loadItinerary(t)) s.updatedAt = Math.max(s.updatedAt||0, 1);
  });
  return s;
}

/* ---------- state + storage ---------- */
let state = null, tab = "score", gameFilter = "all", keepBanner = false;
try { const raw = localStorage.getItem(LS_KEY); if(raw){ const s = JSON.parse(raw); if(s && Array.isArray(s.trips) && s.trips.length) state = migrate(s); } } catch(e){}
if(!state){ const t = newTrip(PRESETS[0]); state = {v:2, updatedAt:0, activeTripId:t.id, trips:[t]}; }

const trip = () => state.trips.find(t => t.id === state.activeTripId) || state.trips[0];
const dayType = t => { t.curDate = today(); return t.days[t.curDate] || t.lastType || "domino"; };

function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
function commit(){
  state.updatedAt = Date.now();
  saveLocal();
  pushCloud();
}

/* ---------- phone <-> computer sync ----------
   Same Firebase Realtime Database project as the License Plates app, under
   its own top-level node ("cruiseScorebook") so the apps never collide.
   This device always keeps a local copy first; the cloud copy is shared by
   every device that opens the scorebook, and the newest save wins. */
const FB_CONFIG = {
  apiKey: ["AIzaSyDWceP3CnO43wj6", "xSu_FQ2jQ9N-LVxSKr8"].join(""),
  authDomain: "household-tasks-cb3ca.firebaseapp.com",
  databaseURL: "https://household-tasks-cb3ca-default-rtdb.firebaseio.com",
  projectId: "household-tasks-cb3ca",
  storageBucket: "household-tasks-cb3ca.firebasestorage.app",
  messagingSenderId: "719926406482",
  appId: "1:719926406482:web:28ccdd630bea4531079e8b",
  measurementId: "G-1GQL33S9EW"
};
const CLOUD_ROOT = "cruiseScorebook";
const CLIENT_ID = Math.random().toString(36).slice(2) + Date.now().toString(36);
const cloud = {ref:null, ok:false, online:false, lastSync:0, error:"", timer:null, writing:false, again:false};
let pendingRemoteRender = false;

function pushCloud(){
  if(!cloud.ref) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(async () => {
    if(cloud.writing){ cloud.again = true; return; }
    cloud.writing = true;
    try{
      await cloud.ref.update({state: JSON.stringify(state), updatedAt: state.updatedAt, __lastWriter: CLIENT_ID});
      cloud.ok = true; cloud.error = ""; cloud.lastSync = Date.now();
    }catch(e){ cloud.ok = false; cloud.error = "Couldn't reach the cloud. Saved on this device."; }
    cloud.writing = false; renderSyncBits();
    if(cloud.again){ cloud.again = false; pushCloud(); }
  }, 500);
}
function applyRemote(remote, updatedAt){
  state = migrate(remote); state.updatedAt = updatedAt; saveLocal();
  const a = document.activeElement;
  if(a && a.tagName === "INPUT" && a.closest("#view")){ pendingRemoteRender = true; return; }
  render();
}
document.addEventListener("focusout", () => { if(pendingRemoteRender){ setTimeout(() => { const a = document.activeElement; if(!(a && a.tagName==="INPUT")){ pendingRemoteRender = false; render(); } }, 50); } });
function initCloud(){
  try{
    if(!window.firebase || !firebase.initializeApp) { cloud.error = "This window can't reach the sync service. Open the scorebook in Safari or Chrome with internet on."; return; }
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    const db = firebase.database();
    cloud.ref = db.ref(CLOUD_ROOT);
    db.ref(".info/connected").on("value", snap => { cloud.online = !!snap.val(); renderSyncBits(); });
    cloud.ref.on("value", snap => {
      cloud.ok = true; cloud.error = "";
      const v = snap.val();
      let remote = null;
      if(v && v.state){ try { remote = JSON.parse(v.state); } catch(e){} }
      if(remote && Array.isArray(remote.trips) && remote.trips.length && (v.updatedAt||0) > (state.updatedAt||0)){
        applyRemote(remote, v.updatedAt);
      } else if((state.updatedAt||0) > ((v && v.updatedAt)||0)){
        pushCloud();
      }
      cloud.lastSync = Date.now();
      renderSyncBits();
    }, err => {
      cloud.ok = false; cloud.error = "The database's rules don't allow the scorebook yet (cruiseScorebook). Scores are saved on this device.";
      renderSyncBits();
    });
  }catch(e){ cloud.ok = false; cloud.error = "Sync couldn't start in this window. Open the scorebook in Safari or Chrome."; }
}
function syncLabel(){
  if(cloud.ok && cloud.online) return {cls:"ok", text:"Synced with your other devices", sub: cloud.lastSync ? "Last synced " + new Date(cloud.lastSync).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) : ""};
  if(cloud.ref && !cloud.online && !cloud.error) return {cls:"wait", text:"Offline. Saving on this device", sub:"It syncs again when you're back online."};
  return {cls:"off", text:"Saved on this device only", sub: cloud.error};
}
function renderSyncBits(){
  const d = document.getElementById("syncdot"); if(d) d.className = "syncdot " + syncLabel().cls;
  const box = document.getElementById("syncStatus");
  if(box){ const l = syncLabel(); box.className = "sync-line " + l.cls; box.innerHTML = `<i></i><span><b>${esc(l.text)}</b>${l.sub?`<small>${esc(l.sub)}</small>`:""}</span>`; }
}

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
function tally(t, type){
  let w1=0,w2=0,ties=0,n=0;
  t.games.forEach(g => { if(type && type!=="all" && g.type!==type) return; n++; g.winner===1?w1++:g.winner===2?w2++:ties++; });
  return {w1,w2,ties,n};
}
function renderHead(){
  const t = trip();
  const route = (t.from || t.to)
    ? `<b>${esc(t.from||"Departure port?")}</b><span aria-hidden="true">→</span><b>${esc(t.to||"Arrival port?")}</b>`
    : `<span>Add ports on the Trips tab</span>`;
  $("#tripHead").innerHTML = `
    <div class="badges" aria-hidden="true">${DOMINO.replace('<svg ','<svg class="dtile" ')}${QCARD.replace('<svg ','<svg class="qcard" ')}</div>
    <div class="eyebrow">${esc(t.ship ? t.ship + " · " : "")}${esc(fmtRange(t.start,t.end))}</div>
    <h1>${esc(t.name)}</h1>
    <div class="route">${route}</div>`;
}

function scoreTop(t, type){
  t.curDate = today();
  const gameNo = t.games.filter(g => g.date === t.curDate && g.type === type).length + 1;
  return `
    <div class="dayrow">
      <span class="eyebrow num">${esc(fmtDate(t.curDate,{weekday:"long",month:"short",day:"numeric"}))} · ${GAMES[type]} game ${gameNo}</span>
    </div>
    <div class="seg" role="group" aria-label="Today's game">
      ${Object.keys(GAMES).map(k => `<button class="b3d" data-type="${k}" aria-pressed="${k===type}">${ICON[k]}${GAMES[k]}</button>`).join("")}
    </div>`;
}

function renderDomino(){
  const t = trip(), c = t.cur, tl = tally(t,"domino");
  const reached = t.target && (c.s1 >= t.target || c.s2 >= t.target);
  const col = (n) => {
    const s = n===1?c.s1:c.s2, name = n===1?t.p1:t.p2, wins = n===1?tl.w1:tl.w2;
    const togo = t.target ? Math.max(0, t.target - s) : null;
    return `<section class="player p${n}" aria-label="${esc(name)}">
      <div class="pname">${esc(name)}</div>
      <div class="score" id="sc${n}">${s}</div>
      ${t.target ? `<div class="meter" aria-hidden="true"><span style="width:${Math.min(100, s/t.target*100)}%"></span></div>` : ""}
      <div class="togo">${togo === null ? "" : togo === 0 ? "Reached " + t.target : togo + " to go"}</div>
      <div class="typein" data-typein="${n}" data-g="domino">
        <label class="sr" for="in${n}">Points for ${esc(name)}</label>
        <input id="in${n}" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off" min="0" max="500" placeholder="pts">
        <button type="button" class="onebtn plus1 b3d" data-typeadd="${n}">Add</button>
      </div>
      <div class="tiles">
        ${[5,10,15,20].map(v => `<button class="tilebtn b3d" data-add="${n}" data-v="${v}" aria-label="Add ${v} to ${esc(name)}"><span class="plus">+</span>${v}</button>`).join("")}
      </div>
      <div class="ones">
        <button class="onebtn b3d" data-add="${n}" data-v="-1" aria-label="Subtract 1 from ${esc(name)}">−1</button>
        <button class="onebtn plus1 b3d" data-add="${n}" data-v="1" aria-label="Add 1 to ${esc(name)}">+1</button>
      </div>
      <div class="pwins">Domino wins this trip <b class="num">${wins}</b></div>
    </section>`;
  };
  const winnerName = c.s1 === c.s2 ? null : (c.s1 > c.s2 ? t.p1 : t.p2);
  $("#view").innerHTML = scoreTop(t,"domino") + `
    <div class="board">${col(1)}${col(2)}</div>
    ${reached && !keepBanner ? `<div class="banner" role="status"><h3>${winnerName ? esc(winnerName) + " reached " + t.target : "Both reached " + t.target}</h3><div class="row"><button class="btn primary b3d" data-act="end">Record the win</button><button class="btn b3d" data-act="keep">Keep playing</button></div></div>` : ""}
    <div class="actions">
      <button class="btn primary b3d" data-act="end" ${c.s1||c.s2 ? "" : "disabled"}>End game${winnerName ? " · " + esc(winnerName) + " wins" : ""}</button>
      <button class="btn b3d" data-act="undo" ${c.log.length ? "" : "disabled"}>Undo</button>
      <button class="btn b3d" data-act="reset" ${c.s1||c.s2 ? "" : "disabled"}>Clear</button>
    </div>
    <div class="target"><label for="target">Play to</label>
      <select id="target">${[100,150,200,250,300,0].map(v=>`<option value="${v}" ${t.target===v?"selected":""}>${v?v+" points":"No limit"}</option>`).join("")}</select>
    </div>
    ${pointsPanels(t, c.log)}
  `;
}

function renderScala(){
  const t = trip(), sc = t.scala, tl = tally(t,"scala"), L = t.limit || 101;
  const out = sc.s1 >= L || sc.s2 >= L;
  const col = (n) => {
    const s = n===1?sc.s1:sc.s2, name = n===1?t.p1:t.p2, wins = n===1?tl.w1:tl.w2;
    const left = Math.max(0, L - s);
    return `<section class="player p${n}" aria-label="${esc(name)}">
      <div class="pname">${esc(name)}</div>
      <div class="score" id="sc${n}">${s}</div>

  };

  $("#view").innerHTML = scoreTop(t,"scala") + `

    </div>

  `;
}
function dominoAdd(n, v){
  const t = trip(), key = n===1?"s1":"s2";
  const nv = Math.max(0, t.cur[key] + v);
  if(nv === t.cur[key]) return;
  t.cur.log.push({p:n, v:nv - t.cur[key]}); t.cur[key] = nv;
  if(t.cur.log.length > 300) t.cur.log = t.cur.log.slice(-300);
  keepBanner = false; commit(); render();
  const el = $("#sc"+n); if(el) el.classList.add("flash");
}
function scalaAdd(n, v){
  const t = trip(), sc = t.scala, key = n===1?"s1":"s2";
  const nv = Math.max(0, sc[key] + v);
  if(nv === sc[key]) return;
  sc.log.push({p:n, v:nv - sc[key]}); sc[key] = nv;
  if(sc.log.length > 300) sc.log = sc.log.slice(-300);
  commit(); render();
  const el = $("#sc"+n); if(el) el.classList.add("flash");
}

function loadItinerary(t){
  const it = ITINERARIES.find(x => x.match(t));
  if(!it || (t.itineraries||[]).includes(it.key)) return false;
  t.ports = Array.isArray(t.ports) ? t.ports : [];
  const have = new Set(t.ports.map(p => (p.name||"").toLowerCase().split(",")[0].trim()));
  it.stops.forEach(([name, date], i) => {
    if(!have.has(name.toLowerCase().split(",")[0].trim())) t.ports.push({id:uid(), name, date, s1:null, s2:null, order:i});
  });
  if(!t.ship || t.ship === "Princess") t.ship = it.ship;
  t.itineraries = [...(t.itineraries||[]), it.key];
  return true;
}

/* departure and arrival ports are added automatically from the trip details */
function ensureEndPorts(t){
  t.ports = Array.isArray(t.ports) ? t.ports : [];
  [["start", t.from, t.start], ["end", t.to, t.end]].forEach(([kind, name, date]) => {
    const i = t.ports.findIndex(p => p.kind === kind);
    name = (name || "").trim();
    if(name){
      if(i < 0) t.ports.push({id:uid(), kind, name, date:date||"", s1:null, s2:null, order:kind==="start"?-1:9e15});
      else { t.ports[i].name = name; t.ports[i].date = date || ""; }
    } else if(i >= 0 && t.ports[i].s1 == null && t.ports[i].s2 == null){
      t.ports.splice(i, 1);
    }
  });
}
function sortPorts(list){
  const rank = p => p.kind === "start" ? 0 : p.kind === "end" ? 2 : 1;
  return list.slice().sort((a,b) => rank(a) - rank(b) || (a.date||"9999").localeCompare(b.date||"9999") || a.order - b.order);
}

const TROPHY = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 8h24v14a12 12 0 0 1-24 0z" fill="#FFE08A" stroke="#3B3551" stroke-width="2.5" stroke-linejoin="round"/><path d="M20 12h-8a8 8 0 0 0 9 10M44 12h8a8 8 0 0 1-9 10" fill="none" stroke="#3B3551" stroke-width="2.5" stroke-linecap="round"/><path d="M27 34h10l-1 10h-8z" fill="#FFE08A" stroke="#3B3551" stroke-width="2.5" stroke-linejoin="round"/><rect x="18" y="44" width="28" height="9" rx="3" fill="#C7A6EC" stroke="#3B3551" stroke-width="2.5"/><path d="M26 15l3 3 6-7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/></svg>';
function celebrate(t, g){
  const root = $("#partyRoot"), tl = tally(t, g.type), name = g.winner===1 ? t.p1 : g.winner===2 ? t.p2 : null;

  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = root.querySelector("canvas"), ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.scale(dpr,dpr);
  const css = getComputedStyle(document.documentElement);
  const main = g.winner===1 ? css.getPropertyValue("--p1") : g.winner===2 ? css.getPropertyValue("--p2") : css.getPropertyValue("--peach");
  const cols = [main, main, css.getPropertyValue("--accent"), css.getPropertyValue("--mint"), "#FFE08A", "#FFFFFF"].map(c => c.trim());
  const bits = Array.from({length:120}, () => ({x:Math.random()*W, y:-20-Math.random()*H*0.6, vx:(Math.random()-.5)*2.2, vy:2+Math.random()*3.2,
    r:Math.random()*6.28, vr:(Math.random()-.5)*.25, w:6+Math.random()*7, h:4+Math.random()*5, c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  (function frame(now){
    if(!cv.isConnected) return;
    const age = now - t0; ctx.clearRect(0,0,W,H);
    bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.vy += .03; b.r += b.vr;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, age-3200)/800);
      ctx.fillStyle = b.c; ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h); ctx.restore(); });
    if(age < 4000) requestAnimationFrame(frame); else ctx.clearRect(0,0,W,H);
  })(t0);
}


/* ---------- Save As… popup (opened from the © line) ---------- */
function backupJSON(){ return JSON.stringify(state, null, 2); }
function triggerDownload(filename, content, mime){
  try{
    const url = URL.createObjectURL(new Blob([content], {type:mime}));
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    setSaveStatus("Download started. Check your Downloads folder.");
  }catch(e){ setSaveStatus("This window can't download files. Open the scorebook file in Safari or Chrome and try again."); }
}
function setSaveStatus(msg){ const el = document.getElementById("saveStatus"); if(el) el.textContent = msg; }
function stamp(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function showSaveAs(){
  const root = document.getElementById("saveRoot");
  if(root.firstChild) return;
  root.innerHTML = `<div class="scrim save-scrim" id="saveScrim"><div class="sheet save-sheet" role="dialog" aria-modal="true" aria-labelledby="saveT">
    <div class="save-h"><h3 id="saveT">Save As…</h3><button type="button" class="xclose" id="saveClose" aria-label="Close">×</button></div>
    <section class="save-sec">
      <p class="eyebrow">Phone and computer sync</p>
      <div id="syncStatus" class="sync-line"></div>
      <div class="save-row"><button type="button" class="btn b3d" id="syncNow">Sync now</button></div>
    </section>
    <section class="save-sec">
      <p class="eyebrow">Download a copy</p>
      <p class="save-help">HTML saves the app itself. JSON saves your trips and games.</p>
      <div class="save-row"><button type="button" class="btn primary b3d" id="saveHtml">Save as HTML</button><button type="button" class="btn primary b3d" id="saveJson">Save as JSON</button></div>
    </section>
    <p class="save-status" id="saveStatus" role="status"></p>
  </div></div>`;
  renderSyncBits();
  const close = () => { root.innerHTML = ""; };
  document.getElementById("saveClose").addEventListener("click", close);
  document.getElementById("saveScrim").addEventListener("click", e => { if(e.target.id === "saveScrim") close(); });
  document.getElementById("syncNow").addEventListener("click", () => {
    if(!cloud.ref){ setSaveStatus(cloud.error || "Sync isn't available here."); return; }
    state.updatedAt = Date.now(); saveLocal(); pushCloud(); setSaveStatus("Sending this device's scores to the cloud…");
    setTimeout(() => setSaveStatus(cloud.ok ? "Synced." : (cloud.error || "Still trying to reach the cloud.")), 2500);
  });
  document.getElementById("saveHtml").addEventListener("click", () => {
    const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML.replace(/<div id="saveRoot">[\s\S]*?<\/div>\s*<script/, '<div id="saveRoot"></div>\n<script');
    triggerDownload("Cruise_Scorebook.html", html, "text/html");
  });
  document.getElementById("saveJson").addEventListener("click", () => triggerDownload("cruise-scorebook-" + stamp() + ".json", backupJSON(), "application/json"));
  document.getElementById("saveClose").focus();
}
(function wireCopyright(){
  const trig = document.getElementById("copyright-trigger");
  trig.addEventListener("click", showSaveAs);
})();

/* ---------- actions ---------- */
function endGame(){
  const t = trip(), type = dayType(t);
  if(type === "domino"){
    const c = t.cur, winner = c.s1===c.s2 ? 0 : (c.s1>c.s2 ? 1 : 2);
    t.games.push({id:uid(), type, date:t.curDate, s1:c.s1, s2:c.s2, winner});
    t.cur = {s1:0, s2:0, log:[]};
  } else {
    const sc = t.scala, winner = sc.s1===sc.s2 ? 0 : (sc.s1<sc.s2 ? 1 : 2);
    t.games.push({id:uid(), type, date:t.curDate, s1:sc.s1, s2:sc.s2, winner, hands:sc.log.length});
    t.scala = blankScala();
  }
  t.days[t.curDate] = type;
  keepBanner = false; commit(); render();
  celebrate(t, t.games[t.games.length-1]);
}
function winnerText(t, type){
  if(type==="domino"){ const c=t.cur; return c.s1===c.s2 ? "a tie" : (c.s1>c.s2?t.p1:t.p2) + " wins"; }
  const sc=t.scala; return sc.s1===sc.s2 ? "a tie" : (sc.s1<sc.s2?t.p1:t.p2) + " wins";
}

document.addEventListener("click", e => {
  const tb = e.target.closest("nav.tabs button");
  if(tb){ tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }

  const ty = e.target.closest("[data-type]");
  if(ty){ const t = trip(); t.days[t.curDate] = ty.dataset.type; t.lastType = ty.dataset.type; keepBanner=false; commit(); render(); return; }

  const ta = e.target.closest("[data-typeadd]");
  if(ta){ typedAdd(+ta.dataset.typeadd); return; }

  const add = e.target.closest("[data-add]");
  if(add){ dominoAdd(+add.dataset.add, +add.dataset.v); return; }

  const sa = e.target.closest("[data-sadd]");
  if(sa){ scalaAdd(+sa.dataset.sadd, +sa.dataset.v); return; }

  const fl = e.target.closest("[data-filter]");
  if(fl){ gameFilter = fl.dataset.filter; renderGames(); return; }

  const del = e.target.closest("[data-del]");
  if(del){
    const t = trip(), g = t.games.find(x => x.id===del.dataset.del); if(!g) return;
    sheet("Delete this game?", `${GAMES[g.type]}: ${esc(t.p1)} ${g.s1} · ${esc(t.p2)} ${g.s2} on ${esc(fmtDate(g.date))}. The win comes off the tally.`, "Delete game", () => { t.games = t.games.filter(x => x.id!==g.id); commit(); render(); }, true);
    return;
  }

  const dp = e.target.closest("[data-delport]");
  if(dp){ const t = trip(), pt = t.ports.find(x => x.id === dp.dataset.delport); if(!pt) return;
    sheet(`Remove ${pt.name}?`, "Its scores come off the cruise average.", "Remove port", () => { t.ports = t.ports.filter(x => x.id !== pt.id); commit(); render(); }, true); return; }

  const tc = e.target.closest("[data-trip]");
  if(tc){ state.activeTripId = tc.dataset.trip; commit(); render(); return; }

  const pr = e.target.closest("[data-preset]");
  if(pr){ const t = newTrip(PRESETS[+pr.dataset.preset]); const cur = trip(); t.p1 = cur.p1; t.p2 = cur.p2; state.trips.push(t); state.activeTripId = t.id; commit(); render(); return; }

  const act = e.target.closest("[data-act]");
  if(!act) return;
  const t = trip(), a = act.dataset.act, type = dayType(t);
  if(a==="end"){
    const sc = type==="domino" ? t.cur : t.scala;
    sheet(`End this ${GAMES[type]} game?`, `${esc(t.p1)} ${sc.s1} · ${esc(t.p2)} ${sc.s2} — recorded as ${esc(winnerText(t,type))}.`, "Record game", endGame);
  }
  else if(a==="keep"){ keepBanner = true; render(); }
  else if(a==="undo"){ const last = t.cur.log.pop(); if(last){ const k = last.p===1?"s1":"s2"; t.cur[k] = Math.max(0, t.cur[k]-last.v); commit(); render(); } }
  else if(a==="sundo"){ const sc=t.scala, last=sc.log.pop(); if(last){ const k = last.p===1?"s1":"s2"; sc[k] = Math.max(0, sc[k]-last.v); commit(); render(); } }
  else if(a==="reset"){
    sheet("Clear both scores?", `This ${GAMES[type]} game goes back to zero. Finished games stay in the tally.`, "Clear scores", () => {
      if(type==="domino") t.cur = {s1:0,s2:0,log:[]}; else t.scala = blankScala();
      keepBanner=false; commit(); render(); }, true);
  }
  else if(a==="addport"){ addPort(); }
  else if(a==="newtrip"){
    const used = new Set(state.trips.map(x => x.name+"|"+x.start));
    $("#presetBox").innerHTML = `<div class="eyebrow">Start from one of your cruises, or a blank trip</div><div class="presets">
      ${PRESETS.map((p,i) => used.has(p.name+"|"+p.start) ? "" : `<button class="preset b3d" data-preset="${i}"><b>${esc(p.name)}</b><br>${esc(p.ship?p.ship+" · ":"")}${esc(p.from)}${p.start?" · "+esc(fmtDate(p.start,{month:"short",day:"numeric",year:"numeric"})):""}</button>`).join("")}
      <button class="preset b3d" data-act="blanktrip"><b>Blank trip</b><br>Fill in the details</button></div>`;
  }
  else if(a==="blanktrip"){ const nt = newTrip(); nt.p1=t.p1; nt.p2=t.p2; state.trips.push(nt); state.activeTripId = nt.id; commit(); render(); setTimeout(()=>{ const f=$("#f-name"); if(f){ f.focus(); f.select(); } }, 0); }
  else if(a==="deltrip"){ sheet(`Delete “${t.name}”?`, `Its ${t.games.length} recorded game${t.games.length===1?"":"s"} will be removed too.`, "Delete trip", () => { state.trips = state.trips.filter(x => x.id!==t.id); state.activeTripId = state.trips[0].id; commit(); render(); }, true); }
});

let typingTimer = null;
document.addEventListener("input", e => {
  const el = e.target, t = trip();
  if(el.dataset && el.dataset.f){ t[el.dataset.f] = el.value; ensureEndPorts(t); clearTimeout(typingTimer); typingTimer = setTimeout(() => { commit(); renderHead(); }, 400); }
});
document.addEventListener("change", e => {
  const el = e.target, t = trip();
  if(el.id === "target"){ t.target = +el.value; keepBanner=false; commit(); render(); }
  else if(el.id === "limit"){ t.limit = +el.value; commit(); render(); }
  else if(el.dataset && el.dataset.f){ t[el.dataset.f] = el.value; ensureEndPorts(t); commit(); renderHead(); }
});
function typedAdd(n){
  const box = document.querySelector(`[data-typein="${n}"]`); if(!box) return;
  const inp = box.querySelector("input"), v = parseInt(String(inp.value).replace(/[^0-9]/g,""), 10);
  if(!v || v <= 0){ inp.value = ""; inp.focus(); return; }
  if(box.dataset.g === "domino") dominoAdd(n, v); else scalaAdd(n, v);
}
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.closest && e.target.closest("[data-typein]")){
    e.preventDefault(); typedAdd(+e.target.closest("[data-typein]").dataset.typein);
  }
});
document.addEventListener("keydown", e => { if(e.key==="Escape"){ $("#sheetRoot").innerHTML=""; $("#partyRoot").innerHTML=""; $("#saveRoot").innerHTML=""; } });

(async () => { try { if(navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch(e){} })();

render();
initCloud();
renderSyncBits();
})();
</script>
